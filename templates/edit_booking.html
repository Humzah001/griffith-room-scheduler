<!DOCTYPE html>
<html>
<head>
    <title>Edit Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles.css">
    <script type="module" src="/static/firebase-login.js"></script>
</head>
<body>

    {% if user_token %}
    <!-- ── Navbar ── -->
    <div class="navbar">
        <h1>Room Scheduler</h1>
        <div class="user-info">
            <span>{{ user_token.get('email', '') }}</span>
            <div id="sign-out-box">
                <button type="button" id="sign-out" class="btn-logout">Log out</button>
            </div>
        </div>
    </div>

    <!-- Hidden login box (needed by JS) -->
    <div id="login-box" hidden>
        <input id="email" type="email" />
        <input id="password" type="password" />
        <button id="login">Login</button>
        <button id="sign-up">Sign Up</button>
    </div>

    <div class="container">
        <a href="/" class="back-link">Back to Main Page</a>

        <div class="card" style="max-width:500px; margin: 20px auto;">
            <h2>Edit Booking</h2>
            <p style="margin-bottom:16px; color:#555;">Room: <strong>{{ room_name }}</strong></p>

            <form action="/edit-booking" method="post">
                <input type="hidden" name="booking_id" value="{{ booking['_id'] }}">

                <div class="form-group" style="margin-bottom:14px;">
                    <label for="edit_date">Date</label>
                    <input type="date" id="edit_date" name="date" value="{{ date }}" required>
                </div>

                <div class="form-group" style="margin-bottom:14px;">
                    <label for="edit_start">Start Time</label>
                    <input type="time" id="edit_start" name="start_time" value="{{ booking['start_time'] }}" required>
                </div>

                <div class="form-group" style="margin-bottom:14px;">
                    <label for="edit_end">End Time</label>
                    <input type="time" id="edit_end" name="end_time" value="{{ booking['end_time'] }}" required>
                </div>

                <div class="form-row" style="margin-top:20px;">
                    <input type="submit" value="Update Booking" class="btn-primary">
                    <a href="/" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    {% else %}
    <!-- ── Login Page ── -->
    <div class="login-container">
        <h1>Room Scheduler</h1>
        <p class="subtitle">Sign in to manage rooms and bookings</p>

        <div class="card">
            <div id="login-box">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="you@example.com" />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Your password" />
                </div>
                <div class="login-buttons">
                    <button id="login">Login</button>
                    <button id="sign-up">Sign Up</button>
                </div>
            </div>
        </div>

        <div id="sign-out-box" hidden>
            <button type="button" id="sign-out">Log out</button>
        </div>
    </div>
    {% endif %}

</body>
</html>
